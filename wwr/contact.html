<!DOCTYPE html>
<html lang="en-US">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us | Loa Rafting</title>
    <meta name="description"
      content="Contact Loa Rafting in Pucón, Chile, to ask about rafting trips, reservations, or share your feedback.">
    <meta name="author" content="Pamela S.T.González Ramírez">
    <link rel="stylesheet" href="styles/rafting.css">
</head>

<body>
    <header> <img src="images/logo.webp" alt="Loa Rafting Logo">
        <nav> <a href="index.html">Home</a> <a href="about.html">About Us</a> <a
              href="trips.html">Trips</a> <a href="contact.html">Contact Us</a> </nav>
    </header>

    <main>
        <h1>Contact Us | Loa Rafting</h1>
        <section class="contact-info">
            <h2>Loa Rafting</h2>
            <p>Address: Av. Bernardo O'Higgins 211, A1, Pucón, Chile</p>
            <p>Phone: +56 9 82094356</p>
            <p>Email: pstgr01@gmail.com</p>

        </section>
        <div class="contact-layout">
            <div class="contact-map">
                <iframe
                  src="https://www.google.com/maps?q=Av.+Bernardo+O%27Higgins+211,+Puc%C3%B3n,+Chile&output=embed"
                  title="Loa Rafting Location" loading="lazy"
                  referrerpolicy="no-referrer-when-downgrade">
                </iframe>
            </div>

            <section class="contact-form">
                <form>
                    <h2>Contact us</h2>

                    <label for="fullname">Full Name</label>
                    <input type="text" id="fullname" name="fullname" required>
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" required>
                    <fieldset>
                        <legend>Purpose of Your Message</legend>
                        <input type="radio" id="general" name="purpose" value="general" required>
                        <label for="general">General Inquiry</label>
                        <input type="radio" id="reservation" name="purpose" value="reservation">
                        <label for="reservation">Reservation Question</label>
                        <input type="radio" id="suggestion" name="purpose" value="suggestion">
                        <label for="suggestion">Website Suggestion</label>
                    </fieldset>
                    <label for="message">Message:</label>
                    <textarea name="message" id="message" rows="8" required></textarea>
                    <div class="newsletter"><input type="checkbox" id="newsletter" name="newsletter"
                          value="yes">
                        <label for="newsletter">Please subscribe me to the monthly
                            newsletter</label>
                    </div>
                    <button type="submit">Send message</button>
                </form>
            </section>
        </div>

        <section class="employees">
            <h2>Our Team</h2>
            <figure>
                <img src="images/team1.webp" alt="Rafting guide">
                <figcaption>Rafting Guide</figcaption>
            </figure>
            <figure>
                <img src="images/team2.webp" alt="Reservation coordinator">
                <figcaption>Reservation Coordinator</figcaption>
            </figure>
            <figure>
                <img src="images/team3.webp" alt="Safety coordinator">
                <figcaption>Safety Coordinator</figcaption>
            </figure>
        </section>
    </main>

    <footer>
        <p>© 2026 | Loa Rafting | Pamela S.T.González Ramírez</p>
        <nav class="socialmedia">
            <a href="https://facebook.com" target="_blank" rel="noopener">
                <img src="images/facebook.svg" alt="Facebook">
            </a>
            <a href="https://instagram.com" target="_blank" rel="noopener">
                <img src="images/instagram.svg" alt="Instagram">
            </a>
            <a href="https://youtube.com" target="_blank" rel="noopener">
                <img src="images/youtube.svg" alt="Youtube">
            </a>

        </nav>


    </footer>

</body>

</html>
