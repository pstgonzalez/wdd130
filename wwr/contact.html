<!DOCTYPE html>
<html lang="en-US">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us | Loa Rafting</title>
    <meta name="description"
      content="Contact Loa Rafting in Pucón, Chile, to ask about rafting trips, reservations, or share your feedback.">
    <meta name="author" content="Pamela S.T.González Ramírez">
    <link rel="stylesheet" href="styles/rafting.css">
</head>

<body>
    <header> <img src="images/logo.webp" alt="Loa Rafting Logo">
        <nav> <a href="index.html">Home</a> <a href="about.html">About Us</a> <a
              href="trips.html">Trips</a> <a href="contact.html">Contact Us</a> </nav>
    </header>
    <main>
        <h1>Contact Us</h1>
        <section class="contact-info">
            <h2>Loa Rafting</h2>
            <p>Address: Av. Bernardo O'Higgins 211, A1, Pucón, Chile</p>
            <p>Phone: +56 9 82094356</p>
            <p>Email: pstgr01@gmail.com</p>
            <iframe title="Location of Loa Rafting in Pucón"
              src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3088.490695572477!2d-71.97707199999999!3d-39.27712100000001!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x96147f3fe86a6a17%3A0x9a420a3d0deab2f1!2sAv.%20Bernardo%20O'Higgins%20211%2C%20a1%2C%204920632%20Pucon%2C%20Puc%C3%B3n%2C%20Araucan%C3%ADa!5e0!3m2!1ses-419!2scl!4v1791150246040!5m2!1ses-419!2scl"
              width="600" height="450" allowfullscreen="" loading="lazy"
              referrerpolicy="strict-origin-when-cross-origin"></iframe>
        </section>
        <section class="employees">
            <h2>Our Team</h2>
            <figure>
                <img src="images/team1.webp" alt="Rafting guide">
                <figcaption>Rafting Guide</figcaption>
            </figure>
            <figure>
                <img src="images/team2.webp" alt="Reservation coordinator">
                <figcaption>Reservation Coordinator</figcaption>
            </figure>
            <figure>
                <img src="images/team3.webp" alt="Safety coordinator">
                <figcaption>Safety Coordinator</figcaption>
            </figure>
        </section>
        <section class="contact-form">
            <h2>Contact us</h2>
            <form>
                <label for="fullname">Full Name</label>
                <input type="text" id="fullname" name="fullname" required>
                <label for="email">Email</label>
                <input type="email" id="email" name="email" required>
                <fieldset>
                    <legend>Purpose of Your Message</legend>
                    <input type="radio" id="general" name="purpose" value="general" required>
                    <label for="general">General Inquiry</label>
                    <input type="radio" id="reservation" name="purpose" value="reservation">
                    <label for="reservation">Reservation Question</label>
                    <input type="radio" id="suggestion" name="purpose" value="suggestion">
                    <label for="suggestion">Website Suggestion</label>
                </fieldset>
                <label for="message">Message:</label>
                <textarea name="message" id="message" rows="8" required></textarea>
                <div class="newsletter"><input type="checkbox" id="newsletter" name="newsletter"
                      value="yes">
                    <label for="newsletter">Please subscribe me to the monthly newsletter</label>
                </div>
                <button type="submit">Send message</button>
            </form>
        </section>


    </main>

    <footer>
        <p>© 2026 | Loa Rafting | Pamela S.T.González Ramírez</p>
        <nav class="socialmedia">
            <a href="https://facebook.com" target="_blank" rel="noopener">
                <img src="images/facebook.svg" alt="Facebook">
            </a>
            <a href="https://instagram.com" target="_blank" rel="noopener">
                <img src="images/instagram.svg" alt="Instagram">
            </a>
            <a href="https://youtube.com" target="_blank" rel="noopener">
                <img src="images/youtube.svg" alt="Youtube">
            </a>

        </nav>


    </footer>

</body>

</html>
