<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML and CSS Quiz| Pamela S.T. González Ramírez</title>
    <link rel="stylesheet" href="styles/quiz.css">
</head>

<body>
    <header>
        <h1>HTML and CSS Quiz</h1>
    </header>
    <main>
        <form>
            <label for="Q1">1. What does HTML stand for?</label>
            <input type="text" id="Q1" name="Q1">
            <label for="Q2">2. What is the purpose of CSS?</label>
            <textarea id="Q2" name="Q2" rows="4"></textarea>
            <label for="Q3">3. Which CSS property changes the text color?</label>
            <select id="Q3" name="Q3">
                <option value="" selected disabled>Choose One ...</option>
                <option value="background-color">background-color</option>
                <option value="color">color</option>
                <option value="font-size">font-size</option>
            </select>
            <label for="Q4">4. How many heading levels does HTML have?</label>
            <input type="number" id="Q4" name="Q4" step="1">

            <button type="submit">Submit Quiz</button>
        </form>
    </main>

</body>

</html>
